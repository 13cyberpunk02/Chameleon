<div class="login-wrap">
  <mat-card class="login-card" appearance="outlined">
    <div class="login-brand">
      <img src="/favicon-shield.svg" alt="Chameleon" class="login-logo"/>
      <h1>Chameleon</h1>
      <p class="muted">Панель управления</p>
    </div>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full">
        <mat-label>API-токен</mat-label>
        <input matInput type="password" [(ngModel)]="token" (keyup.enter)="submit()" autofocus/>
        <mat-icon matSuffix>key</mat-icon>
      </mat-form-field>

      @if (error()) {
        <p class="err">
          <mat-icon>error</mat-icon>
          {{ error() }}
        </p>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      <button matButton="filled" color="primary" (click)="submit()" [disabled]="busy()">
        @if (busy()) {
          <mat-spinner diameter="18"></mat-spinner>
        } @else {
          Войти
        }
      </button>
    </mat-card-actions>
  </mat-card>
</div>
