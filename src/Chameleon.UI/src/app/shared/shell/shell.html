<mat-toolbar class="topbar">
  <button matIconButton class="burger" (click)="toggle()" matTooltip="Меню">
    <mat-icon>{{ open() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <div class="logo">
    <mat-icon>shield</mat-icon>
    <span>Chameleon</span>
  </div>
  <span class="spacer"></span>

  <button matIconButton [matMenuTriggerFor]="themeMenu" matTooltip="Тема" class="tb-btn">
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu">
    <button mat-menu-item (click)="setTheme('system')">
      <mat-icon>brightness_auto</mat-icon>
      <span>Система</span></button>
    <button mat-menu-item (click)="setTheme('light')">
      <mat-icon>light_mode</mat-icon>
      <span>Светлая</span></button>
    <button mat-menu-item (click)="setTheme('dark')">
      <mat-icon>dark_mode</mat-icon>
      <span>Тёмная</span></button>
  </mat-menu>

  <button matIconButton (click)="logout()" matTooltip="Выйти" class="tb-btn">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="body">
  @if (open()) {
    <div class="scrim" (click)="close()"></div>
  }

  <nav class="sidebar" [class.open]="open()">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" (click)="close()">
      <mat-icon>dashboard</mat-icon>
      <span>Дашборд</span>
    </a>
    <a class="nav-item" routerLink="/clients" routerLinkActive="active" (click)="close()">
      <mat-icon>group</mat-icon>
      <span>Клиенты</span>
    </a>
    <a class="nav-item" routerLink="/server" routerLinkActive="active" (click)="close()">
      <mat-icon>dns</mat-icon>
      <span>Сервер</span>
    </a>
  </nav>

  <main class="content">
    <router-outlet/>
  </main>
</div>
