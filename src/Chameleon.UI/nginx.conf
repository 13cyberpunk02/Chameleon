# Если перед панелью стоит внешний прокси с TLS, берём источник и схему от него.
# Порт панели публикуется только на 127.0.0.1, поэтому подделать эти заголовки снаружи нельзя.
map $http_x_real_ip $panel_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $panel_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://chameleon:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $panel_client_ip;
        proxy_set_header X-Forwarded-Proto $panel_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
