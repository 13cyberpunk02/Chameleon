services:
  chameleon:
    build: .
    image: chameleon-server
    container_name: chameleon
    restart: unless-stopped
    ports:
      - "${CHAMELEON_PORT:-443}:8443" # снаружи 443 (похоже на обычный HTTPS) → внутрь 8443
    volumes:
      - chameleon-data:/data  # постоянный ключ сервера
    environment:
      - CHAMELEON_SNI=${CHAMELEON_SNI:-www.example-cdn.com}
      - CHAMELEON_PUBLIC=${CHAMELEON_PUBLIC:-}      # адрес сервера в ссылках клиентов, например 203.0.113.5:443
      - CHAMELEON_DECOY=${CHAMELEON_DECOY:-}        # необязательно: сайт-прикрытие host:port без TLS, например example.com:80
      - CHAMELEON_ALLOWLIST=${CHAMELEON_ALLOWLIST:-0}
      # - CHAMELEON_CERT_PFX=/data/cert.pfx    # необязательно: боевой сертификат вместо самоподписанного
      # - CHAMELEON_CERT_PASS=...
      # Панель: API включается токеном и наружу не публикуется, до него ходит только контейнер panel.
      - CHAMELEON_API_TOKEN=${CHAMELEON_API_TOKEN:-}
      - CHAMELEON_API_TRUST_PROXY=1

  # Веб-панель: docker compose --profile panel up -d --build
  panel:
    profiles: [panel]
    build: src/Chameleon.UI
    image: chameleon-panel
    container_name: chameleon-panel
    restart: unless-stopped
    depends_on:
      - chameleon
    ports:
      - "127.0.0.1:8080:8080" # только локально: доступ через SSH-туннель или внешний прокси с TLS

volumes:
  chameleon-data:
